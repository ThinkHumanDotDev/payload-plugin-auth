name: Publish

# Publishes when package.json's version is not on npm yet after a push to main.
#
# Security:
# - Only push / workflow_dispatch — never pull_request or pull_request_target
# - github.repository guard so fork workflows cannot publish
# - No actions/cache (no shared cache with untrusted PR jobs)
# - Minimal permissions; checkout without persisting credentials
# - npm environment must match the Trusted Publisher environment name on npm
# - Publishes via npm Trusted Publisher (OIDC); no NPM_TOKEN secret

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check-version:
    name: Check npm version
    if: github.repository == 'ThinkHumanDotDev/payload-plugin-auth'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.npm.outputs.publish }}
      version: ${{ steps.npm.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Compare package.json version to the registry
        id: npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE=$(node -p "require('./package.json').name")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already on npm; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not on npm; will validate and publish."
          fi

  publish:
    name: Publish to npm
    needs: check-version
    if: >-
      github.repository == 'ThinkHumanDotDev/payload-plugin-auth' &&
      needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10.x).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm pack --dry-run
      # Do not set NODE_AUTH_TOKEN — setup-node's registry-url .npmrc must fall through to OIDC
      # Trusted Publishing instead of a classic token.
      - name: Publish to npm
        run: |
          npm --version
          npm publish --provenance --access public --ignore-scripts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists; skipping."
            exit 0
          fi
          # The CHANGELOG section of this version becomes the release notes.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
