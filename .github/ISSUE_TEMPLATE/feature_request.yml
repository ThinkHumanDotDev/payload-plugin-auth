name: Feature request
description: Propose a feature, a provider preset or an improvement
title: 'feat: '
labels: ['type:feat']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Proposed solution
      description: What should the package do? For a provider preset, link the provider's OAuth/OIDC/SAML documentation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of verifiable outcomes.
